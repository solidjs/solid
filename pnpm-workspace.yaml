packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@dom-expressions/babel-plugin-jsx'
  - '@dom-expressions/hyperscript'
  - '@dom-expressions/runtime'
  - '@dom-expressions/tagged-jsx'
  - 'vite-plugin-solid'

overrides:
  babel-preset-solid: workspace:*
  '@solidjs/signals': workspace:*
  solid-js: workspace:*
  '@solidjs/web': workspace:*
  # Unreleased runtime work rides both repos' next branches (DR-2 landed,
  # CSS reveal gating landed): link the sibling checkout so tests exercise
  # the current runtime. Drop once the runtime publishes.
  '@dom-expressions/runtime': link:../dom-expressions/packages/runtime

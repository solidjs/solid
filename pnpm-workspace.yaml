packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  esbuild: true
  simple-git-hooks: true

confirmModulesPurge: false

minimumReleaseAgeExclude:
  - '@dom-expressions/babel-plugin-jsx'
  - '@dom-expressions/compiler'
  - '@dom-expressions/hyperscript'
  - '@dom-expressions/runtime'
  - '@dom-expressions/tagged-jsx'
  - '@solidjs/vite-plugin'

overrides:
  babel-preset-solid: workspace:*
  '@solidjs/signals': workspace:*
  solid-js: workspace:*
  '@solidjs/web': workspace:*
  # @solidjs/vite-plugin still pins the compiler at .40; force the snapshot
  # carrying the #3015 scope fix and #3011 lazy signature until it re-releases.
  '@dom-expressions/compiler': 0.50.0-next.43

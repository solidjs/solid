packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  esbuild: true
  simple-git-hooks: true

confirmModulesPurge: false

minimumReleaseAgeExclude:
  - '@dom-expressions/babel-plugin-jsx'
  - '@dom-expressions/compiler'
  - '@dom-expressions/hyperscript'
  - '@dom-expressions/runtime'
  - '@dom-expressions/tagged-jsx'
  - '@solidjs/vite-plugin'

overrides:
  babel-preset-solid: workspace:*
  '@dom-expressions/babel-plugin-jsx': link:../dom-expressions-dr2/packages/babel-plugin-jsx
  '@dom-expressions/runtime': link:../dom-expressions-dr2/packages/runtime
  '@dom-expressions/hyperscript': link:../dom-expressions-dr2/packages/hyperscript
  '@dom-expressions/tagged-jsx': link:../dom-expressions-dr2/packages/tagged-jsx
  '@solidjs/signals': workspace:*
  solid-js: workspace:*
  '@solidjs/web': workspace:*
  # Stage-2 patch channel: runtime with the patch-mode list seam (insert →
  # driveList) and the compiler with patch-mode emission (patchDriver
  # config). Same versions as published plus the seam commits.
  '@dom-expressions/runtime': link:../dom-expressions-patch/packages/runtime
  '@dom-expressions/babel-plugin-jsx': link:../dom-expressions-patch/packages/babel-plugin-jsx

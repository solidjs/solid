packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@dom-expressions/babel-plugin-jsx'
  - '@dom-expressions/hyperscript'
  - '@dom-expressions/runtime'
  - '@dom-expressions/tagged-jsx'
  - 'vite-plugin-solid'

overrides:
  babel-preset-solid: workspace:*
  '@solidjs/signals': workspace:*
  solid-js: workspace:*
  '@solidjs/web': workspace:*
  # TEMPORARY: local link while the plugin's single-flight handler wiring
  # (frameTransformFlightResult) and the isRunnableEnvironment fix are
  # unreleased; drop once the release after 3.0.0-next.20 is out.
  'vite-plugin-solid': link:../vite-plugin-solid

packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  esbuild: true
  simple-git-hooks: true

confirmModulesPurge: false

minimumReleaseAgeExclude:
  - '@dom-expressions/babel-plugin-jsx'
  - '@dom-expressions/compiler'
  - '@dom-expressions/hyperscript'
  - '@dom-expressions/runtime'
  - '@dom-expressions/tagged-jsx'
  - '@solidjs/vite-plugin'

overrides:
  babel-preset-solid: workspace:*
  # Stage-2 patch channel: the patch-mode worktree (rebased onto
  # dom-expressions next, superset of dr2's current base) carries the
  # list seam (insert → driveList), patch-mode emission (patchDriver),
  # and the runtime patchDriver export.
  '@dom-expressions/babel-plugin-jsx': link:../dom-expressions-patch/packages/babel-plugin-jsx
  '@dom-expressions/runtime': link:../dom-expressions-patch/packages/runtime
  '@dom-expressions/hyperscript': link:../dom-expressions-patch/packages/hyperscript
  '@dom-expressions/tagged-jsx': link:../dom-expressions-patch/packages/tagged-jsx
  '@solidjs/signals': workspace:*
  solid-js: workspace:*
  '@solidjs/web': workspace:*

name: 'Solid CI'

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
      - next

# A push gets its own group, so every commit on next keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
 job:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - uses: pnpm/action-setup@v4
  - uses: actions/setup-node@v4
    with:
      node-version-file: ".nvmrc"
      registry-url: "https://registry.npmjs.org"
      cache: "pnpm"

  # Cheap guard for the workspace layout the release pipeline depends on
  # (link stubs, workspace-resolved compiler, no registry pins in the
  # lockfile). Violations deadlock the release commit — see the script.
  - name: Release invariants
    run: node scripts/check-release-invariants.mjs

  - name: Installing deps
    run: pnpm install

  # The compiler resolves to the workspace (pnpm-workspace.yaml overrides),
  # so suites that load it through @solidjs/vite-plugin (element, web) need
  # the local binding built — the root build script skips the Rust build.
  - uses: dtolnay/rust-toolchain@stable
  - uses: Swatinem/rust-cache@v2
    with:
      workspaces: packages/compiler

  - name: Building compiler binding
    run: pnpm --filter @solidjs/compiler run build

  - name: Building
    run: pnpm run build

  - name: Testing & Coverage
    # Coveralls only reads solid-js's lcov, so signals and web skip a second run.
    run: |
      pnpm run test
      pnpm run coverage --filter=solid-js

  - name: Coveralls
    # Coverage reporting is informational: an outage or a bad release of the
    # reporter binary (checksum mismatch, a 504 on the checksum download) must
    # not fail the required job. `fail-on-error` alone misses some install
    # paths, so the step is also allowed to fail.
    continue-on-error: true
    uses: coverallsapp/github-action@v2
    with:
      base-path: packages/solid
      path-to-lcov: "./packages/solid/coverage/lcov.info"
      github-token: ${{ secrets.GITHUB_TOKEN }}
      fail-on-error: false

  - name: Archive production artifacts
    uses: actions/upload-artifact@v4
    with:
      name: dist-folder
      path: |
        '*/dist'
        '*/types'

 # @solidjs/babel-plugin peers @babel/core ^7 || ^8 and keeps its own 7.x
 # helpers, so this runs its suite against the core a Babel 8 user installs.
 babel-8:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - uses: pnpm/action-setup@v4
  - uses: actions/setup-node@v4
    with:
      node-version-file: ".nvmrc"
      cache: "pnpm"

  - name: Installing deps
    run: pnpm install

  - name: Building babel plugin
    run: pnpm --filter @solidjs/babel-plugin run build

  - name: Swapping in @babel/core 8
    run: |
      npm install --prefix "$RUNNER_TEMP/babel8" --no-save --no-package-lock @babel/core@^8
      ln -sfn "$RUNNER_TEMP/babel8/node_modules/@babel/core" packages/babel-plugin/node_modules/@babel/core
      node -p "'@babel/core ' + require('./packages/babel-plugin/node_modules/@babel/core/package.json').version"

  - name: Testing on Babel 8
    working-directory: packages/babel-plugin
    run: pnpm exec vitest run

 # Production builds lower `<Show>` to the ternary it renders (lowerShow),
 # while the web suites compile with dev on, so they keep the component.
 # This runs them lowered on both compilers, so a runtime change that only
 # breaks the lowered shape still fails a PR. Specs about the component's own
 # dev behavior skip themselves here (LOWERED_SKIP in the vite configs).
 lowered-show:
  runs-on: ubuntu-latest
  strategy:
   fail-fast: false
   matrix:
    compiler: [native, babel]
  steps:
  - uses: actions/checkout@v4
  - uses: pnpm/action-setup@v4
  - uses: actions/setup-node@v4
    with:
      node-version-file: ".nvmrc"
      cache: "pnpm"

  - name: Installing deps
    run: pnpm install

  - uses: dtolnay/rust-toolchain@stable
  - uses: Swatinem/rust-cache@v2
    with:
      workspaces: packages/compiler

  - name: Building compiler binding
    run: pnpm --filter @solidjs/compiler run build

  - name: Building
    run: pnpm run build

  - name: Testing web with Show lowered
    working-directory: packages/web
    env:
      LOWER_SHOW: "1"
      JSX_COMPILER: ${{ matrix.compiler }}
    run: pnpm run test

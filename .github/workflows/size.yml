name: Size

# Tracks tree-shaken scenario costs per PR (#2883). The .size-limit.json
# entries are import-cost scenarios, not file sizes: the limits are the strict
# gate for tree-shaking regressions (a re-coupled feature module shows up as
# hundreds of bytes against ~5% headroom). The retained-module-graph
# assertions in packages/solid-signals/tests/treeshake.test.ts remain the
# precise which-module-re-coupled diagnostic; this is the ceiling gate and
# trend tracker on top.
on:
  pull_request:
    branches: [main, next]

permissions:
  contents: read
  pull-requests: write

jobs:
  # The hard gate: self-contained on the PR head, fails when any scenario
  # exceeds its limit. Never depends on the base branch.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm size

  # Best-effort base-vs-head delta comment. Requires the base branch to also
  # carry the size-limit setup, so it is informational and never blocks:
  # continue-on-error keeps bootstrap PRs (and any action hiccup) green.
  compare:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - uses: andresz1/size-limit-action@v1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
          build_script: build

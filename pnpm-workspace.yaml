packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@dom-expressions/babel-plugin-jsx'
  - '@dom-expressions/compiler'
  - '@dom-expressions/hyperscript'
  - '@dom-expressions/runtime'
  - '@dom-expressions/tagged-jsx'
  - 'vite-plugin-solid'

overrides:
  babel-preset-solid: workspace:*
  '@solidjs/signals': workspace:*
  solid-js: workspace:*
  '@solidjs/web': workspace:*
  # vite-plugin-solid pins the native compiler at next.34, which predates the
  # #2959 condition-memo symmetry fix (851ef225, in next.35+): conditional
  # component props hydrate with drifted ids under the native compiler.
  # Drop once vite-plugin-solid bumps its pin.
  '@dom-expressions/compiler': 0.50.0-next.40

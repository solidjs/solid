packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@dom-expressions/babel-plugin-jsx'
  - '@dom-expressions/hyperscript'
  - '@dom-expressions/runtime'
  - '@dom-expressions/tagged-jsx'
  - 'vite-plugin-solid'

overrides:
  babel-preset-solid: workspace:*
  '@solidjs/signals': workspace:*
  solid-js: workspace:*
  '@solidjs/web': workspace:*
  # TEMPORARY: local link while the call-site handoff work (frame rebind +
  # COMPONENT_HANDOFF transport contract) rides unreleased dom-expressions
  # changes; drop once the release after 0.50.0-next.34 is published.
  '@dom-expressions/runtime': link:../dom-expressions/packages/runtime

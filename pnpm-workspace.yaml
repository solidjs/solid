packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@dom-expressions/babel-plugin-jsx'
  - '@dom-expressions/hyperscript'
  - '@dom-expressions/runtime'
  - '@dom-expressions/tagged-jsx'
  - 'vite-plugin-solid'

overrides:
  babel-preset-solid: workspace:*
  '@solidjs/signals': workspace:*
  solid-js: workspace:*
  '@solidjs/web': workspace:*
  # DR-2 case 1 (expression bindings) rides both repos' dr2 branches: link
  # the sibling runtime worktree so the frame tests exercise the binding
  # ledger this branch's ctx.commit hooks feed. Drop before merge, once the
  # runtime publishes.
  '@dom-expressions/runtime': link:../dom-expressions-dr2/packages/runtime

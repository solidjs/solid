packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  esbuild: true
  simple-git-hooks: true

confirmModulesPurge: false

minimumReleaseAgeExclude:
  - '@solidjs/vite-plugin'

overrides:
  '@solidjs/signals': workspace:*
  solid-js: workspace:*
  '@solidjs/web': workspace:*
  '@solidjs/babel-plugin-jsx': workspace:*
  # Platform binaries are not on the registry until the binaries workflow
  # publishes them; link in-repo stubs so frozen CI installs resolve.
  '@solidjs/compiler-darwin-x64': 'link:packages/compiler/npm/darwin-x64'
  '@solidjs/compiler-darwin-arm64': 'link:packages/compiler/npm/darwin-arm64'
  '@solidjs/compiler-linux-x64-gnu': 'link:packages/compiler/npm/linux-x64-gnu'
  '@solidjs/compiler-linux-arm64-gnu': 'link:packages/compiler/npm/linux-arm64-gnu'
  '@solidjs/compiler-win32-x64-msvc': 'link:packages/compiler/npm/win32-x64-msvc'
  '@solidjs/compiler-wasm32-wasi': 'link:packages/compiler/npm/wasm32-wasi'

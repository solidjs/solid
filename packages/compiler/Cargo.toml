[package]
name = "solidjs-compiler"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["node", "tsrx"]
node = ["dep:napi", "dep:napi-derive"]
# TSRX syntax frontend. `tsrx_parser_engine` (community oxc-tsrx project, pinned
# rev) is the only TSRX grammar authority on the Rust side; it carries its own
# git-pinned oxc (0.140) which coexists with our crates.io oxc — no oxc types
# cross the boundary (the parse result is a revision-neutral FlatTape).
tsrx = [
  "dep:oxc_sourcemap",
  "dep:tsrx_parser_engine",
  "dep:tsrx_syntax",
  "dep:tsrx_tape_schema",
]

[dependencies]
html5ever = "0.39.0"
htmlize = { version = "1", features = ["unescape"] }
markup5ever_rcdom = "0.39.0"
napi = { version = "3.12", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "3.6", optional = true }
oxc_allocator = "0.144"
oxc_ast = "0.144"
oxc_ast_visit = "0.144"
oxc_codegen = "0.144"
oxc_parser = "0.144"
oxc_semantic = "0.144"
oxc_sourcemap = { version = "8.1", optional = true }
oxc_span = "0.144"
oxc_str = "0.144"
oxc_syntax = "0.144"
tsrx_parser_engine = { git = "https://github.com/tsrx-org/oxc", rev = "135653a23aab15231557112548812275baba8727", optional = true }
tsrx_syntax = { git = "https://github.com/tsrx-org/oxc", rev = "135653a23aab15231557112548812275baba8727", optional = true }
tsrx_tape_schema = { git = "https://github.com/tsrx-org/oxc", rev = "135653a23aab15231557112548812275baba8727", optional = true }

[dev-dependencies]
# `noop` stubs the Node-API symbols so `cargo test` can link the unit-test
# harness (the classification-trace tests) without a Node host. Dev-only:
# the shipped cdylib is unaffected.
napi = { version = "3.12", default-features = false, features = ["napi4", "noop"] }

[build-dependencies]
napi-build = "2.4"

name: Size

# Tracks tree-shaken scenario costs per PR (#2883). scripts/size/ is a
# standalone npm package OUTSIDE the pnpm workspace on purpose: adding its
# tooling to the workspace graph re-keys pnpm peer instances (vitest,
# @codspeed/vitest-plugin), which relocates the benchmark harness and shows
# up as phantom CodSpeed regressions. The limits in scripts/size/scenarios.js
# are the strict tree-shaking gate, measured with Rolldown (the bundler Vite
# ships); the retained-module-graph assertions in
# packages/signals/tests/treeshake.test.ts stay the which-module diagnostic
# underneath.
#
# Three jobs. `head` measures the commit under test; `base` (PRs only)
# measures the PR's base with the head's harness; `check` — the required
# status — decides with both (scripts/size/gate.mjs): a scenario fails only
# when it is over its brotli cap AND grew past the minified allowance over
# the base. The decision needs the base's minified numbers, so the base
# measurement moved from the old informational `compare` job (which ran after
# `check`) into a job `check` waits on; `head` and `base` run in parallel.
# Pushes to next are gated too, against the commit before the push —
# PR-only triggering let the +createStore scenario sit failing at a release
# commit unnoticed.
on:
  push:
    branches: [next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read
  pull-requests: write

jobs:
  head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The examples' builds load the workspace @solidjs/compiler through the
      # vite plugin; the root build skips the Rust build, so build the binding.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compiler
      - run: pnpm --filter @solidjs/compiler run build
      - run: pnpm build
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/size
      # size.mjs prints the lazy chunks and per-package minified bytes for
      # each scenario, so a bump is attributed in the same log that reports
      # it. --no-gate: the decision is check's. Uploaded on pushes too — a
      # push to next's size-head is what `npm run ratchet -- --from` reads.
      - run: npm run size -- --json size-head.json --no-gate
        working-directory: scripts/size
      - uses: actions/upload-artifact@v4
        with:
          name: size-head
          path: scripts/size/size-head.json

  # Builds the base and measures its artifacts with the HEAD's harness
  # (SIZE_PACKAGES_ROOT), so both sides come from the same scenarios and the
  # same Rolldown. On a PR the head is the merge commit with base.sha, so the
  # difference is the PR's own change; on a push it is the pushed range
  # (`before`), so a merge that passed with a noise warning does not turn
  # next red on the absolute cap. continue-on-error: a base the head's
  # harness cannot build or measure leaves check on absolute caps instead of
  # blocking.
  base:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          path: base
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: base/packages/compiler
      - run: pnpm install --frozen-lockfile
        working-directory: base
      - run: pnpm --filter @solidjs/compiler run build
        working-directory: base
      - run: pnpm build
        working-directory: base
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/size
      - run: node size.mjs --json size-base.json --no-gate
        working-directory: scripts/size
        env:
          SIZE_PACKAGES_ROOT: ${{ github.workspace }}/base
      - uses: actions/upload-artifact@v4
        with:
          name: size-base
          path: scripts/size/size-base.json

  # The hard gate (the required status). always(): it runs when base failed;
  # a failed head leaves no size-head artifact and fails here.
  check:
    if: always()
    needs: [head, base]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/size
      # gate.mjs's own tests; scripts/size is outside the workspace `pnpm test`.
      - run: npm test
        working-directory: scripts/size
      - uses: actions/download-artifact@v4
        with:
          name: size-head
          path: scripts/size
      - continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: size-base
          path: scripts/size
      # The job summary carries the report on every run. The comment only
      # goes on PRs from this repository: a fork PR's token is read-only, so
      # createComment answers 403. Rendered before the gate step so a failing
      # PR still gets its table.
      - run: node report.mjs size-head.json size-base.json > size-comment.md
        working-directory: scripts/size
      - run: cat size-comment.md >> "$GITHUB_STEP_SUMMARY"
        working-directory: scripts/size
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("scripts/size/size-comment.md", "utf8");
            const marker = "<!-- size-report -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.user.type === "Bot" && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - run: node gate.mjs size-head.json size-base.json
        working-directory: scripts/size
      # The floor and page caps (scripts/size/floor-caps.json) are frozen: a PR
      # may lower them, never raise them, unless its body carries a
      # `Size-Exception:` line. Compared against the PR's base branch, so
      # PR events only. always(): reported even when the gate step failed.
      - if: always() && github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
      - if: always() && github.event_name == 'pull_request'
        run: npm run check-floor-caps -- "origin/${{ github.base_ref }}"
        working-directory: scripts/size
        env:
          SIZE_EXCEPTION: ${{ github.event.pull_request.body }}

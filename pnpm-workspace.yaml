packages:
  - 'packages/*'
  - 'examples/*'

allowBuilds:
  esbuild: true
  simple-git-hooks: true

confirmModulesPurge: false

minimumReleaseAgeExclude:
  - '@solidjs/vite-plugin'

overrides:
  '@solidjs/signals': workspace:*
  solid-js: workspace:*
  '@solidjs/web': workspace:*
  '@solidjs/babel-plugin': workspace:*

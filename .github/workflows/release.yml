name: Release

on:
  push:
    branches:
      - next

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The workspace resolves @solidjs/compiler locally, so everything that
      # loads it through @solidjs/vite-plugin (the examples built by
      # release.mjs's `pnpm run build` included) needs the binding built —
      # the root build script skips the Rust build.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compiler

      - name: Build compiler binding
        run: pnpm --filter @solidjs/compiler run build

      - name: Create version pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          title: Release RC packages
          commit: Version packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # rc.9 moves delegated events to the `_$$<type>` key; the solid-query
          # fixture's published compiler still emits `$$<type>`, so the gate
          # cannot pass until rc.9 itself ships (see scripts/release.mjs).
          # Expires with this version — leave it until the fixture is bumped.
          SKIP_SOLID_QUERY_GATE: 2.0.0-rc.9

  # Installs the just-published packages from the real registry into a temp
  # project and exercises them (dist-tags, native compiler binary, runtime).
  smoke:
    name: Smoke test published packages
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Smoke test
        run: node scripts/smoke-release.mjs
